# Déploiement Render (Web Service Node). Build : npm install (compile le front via postinstall). Démarrage : npm start.
services:
  - type: web
    name: shopflow-rdc
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
