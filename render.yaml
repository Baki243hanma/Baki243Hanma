# Déploiement Render (Web Service Node).
# Build : npm install (compile la PWA via postinstall). Démarrage : npm start (applique les migrations, puis écoute).
# Les secrets (DATABASE_URL) ne sont jamais écrits ici : renseignez-les dans le tableau de bord Render.
services:
  - type: web
    name: shopflow-rdc
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_URL
        sync: false
      - key: MIGRATE_ON_START
        value: "true"
